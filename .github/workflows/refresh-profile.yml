name: Refresh profile

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check calculations and rendering
        run: node --test scripts/*.test.cjs
      - name: Refresh GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: pljf
        run: node scripts/refresh-profile.cjs
      - name: Publish refreshed profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/reference-*.svg data/profile.json
          if git diff --cached --quiet; then
            echo 'Profile is already current.'
            exit 0
          fi
          git commit -m 'Refresh GitHub activity'
          git push origin HEAD:main
