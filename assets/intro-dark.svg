<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315" viewBox="0 0 1000 315" role="img" aria-labelledby="title description">
<title id="title">Patrick Luo — kinetic introduction</title>
<desc id="description">Patrick Luo. Computer Science and Mathematics at Hunter College, CUNY. New York City. Expected graduation May 2027. Large outline echoes converge while the letters assemble from opposing halves. A sweep fills the name, then the details appear. The animation plays once. Reduced-motion preferences show the complete still composition.</desc>
<style>
:root{--elapsed:0s}
.static-name{fill:#f0f6fc}
.animated-name{display:none}
.echo{fill:none;stroke:#20c9c5;stroke-width:1.8;opacity:0;transform-origin:500px 115px}
.piece{transform:translate(0,0)}
.edge{fill:#20c9c5;fill-opacity:.14;stroke:#20c9c5;stroke-width:1.8;opacity:0}
.ink-reveal{transform-origin:100px 0;transform:scaleX(1)}
.lock{transform-origin:500px 115px;transform:scale(1)}
.divider{transform-origin:500px 173px;transform:scaleX(1)}
.academic,.location{opacity:1;transform:translateY(0)}
@media(prefers-reduced-motion:no-preference){
 .static-name{animation:final-wordmark .01s linear calc(2.45s - var(--elapsed)) both}
 .animated-name{display:inline;animation:retire-fragments .01s linear calc(2.45s - var(--elapsed)) both}
 .echo-left{animation:echo-left 1.7s cubic-bezier(.16,1,.3,1) calc(0s - var(--elapsed)) both}
 .echo-right{animation:echo-right 1.7s cubic-bezier(.16,1,.3,1) calc(.12s - var(--elapsed)) both}
 .piece{animation:assemble 1.45s cubic-bezier(.2,.75,.2,1) calc(var(--stagger) - var(--elapsed)) both}
 .edge{animation:edge-out 2.2s ease-out calc(.1s - var(--elapsed)) both}
 .ink-reveal{animation:ink-sweep 1.1s cubic-bezier(.65,0,.25,1) calc(1s - var(--elapsed)) both}
 .lock{animation:lock-in .55s cubic-bezier(.16,1,.3,1) calc(1.9s - var(--elapsed)) both}
 .divider{animation:rule-open .8s cubic-bezier(.16,1,.3,1) calc(1.9s - var(--elapsed)) both}
 .academic{animation:detail-in .65s cubic-bezier(.16,1,.3,1) calc(2.25s - var(--elapsed)) both}
 .location{animation:detail-in .65s cubic-bezier(.16,1,.3,1) calc(2.6s - var(--elapsed)) both}
}
@keyframes echo-left{0%{opacity:0;transform:translate(-150px,-24px) scale(1.32)}18%{opacity:.35}72%{opacity:.12}100%{opacity:0;transform:translate(0,0) scale(1)}}
@keyframes echo-right{0%{opacity:0;transform:translate(150px,24px) scale(1.32)}18%{opacity:.28}72%{opacity:.10}100%{opacity:0;transform:translate(0,0) scale(1)}}
@keyframes final-wordmark{from{opacity:0}to{opacity:1}}
@keyframes retire-fragments{from{opacity:1}to{opacity:0}}
@keyframes assemble{0%{transform:translate(var(--dx),var(--dy))}74%{transform:translate(var(--over),0)}100%{transform:translate(0,0)}}
@keyframes edge-out{0%,50%{opacity:1}100%{opacity:0}}
@keyframes ink-sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lock-in{from{transform:scale(1.025)}to{transform:scale(1)}}
@keyframes rule-open{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes detail-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
</style>
